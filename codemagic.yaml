workflows:
  ios-testflight:
    name: Melb Takraw iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.takraw.melb.sportapp
      vars:
        XCODE_PROJECT: "Apps/MelbTakraw/MelbTakraw.xcodeproj"
        XCODE_SCHEME: "MelbTakraw"
        BUNDLE_ID: "com.takraw.melb.sportapp"
        APP_STORE_APPLE_ID: "6769767814"
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show Xcode version
        script: xcodebuild -version

      - name: Resolve Swift packages
        script: |
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -resolvePackageDependencies

      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Increment build number
        script: |
          PROJECT_DIR="$(dirname "$CM_BUILD_DIR/$XCODE_PROJECT")"
          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            RAW_LATEST_BUILD="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"
            LATEST_BUILD_NUMBER="$(printf '%s\n' "$RAW_LATEST_BUILD" | tr -dc '0-9\n' | tail -n 1)"
            if [ -n "$LATEST_BUILD_NUMBER" ]; then
              BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
            fi
          fi
          echo "Using CFBundleVersion=$BUILD_NUMBER"
          cd "$PROJECT_DIR"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
